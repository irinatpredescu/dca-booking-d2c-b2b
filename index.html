document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

rotect */\n  --dca-navy-mid:#364B6D;     /* mid navy / dark-gradient start */\n  --dca-blue:#70B7FF;         /* bright brand blue / DCA Core */\n  --dca-blue-light:#C6DDEE;   /* light blue / light-gradient start */\n\n  /* Highlight — minimal use, pullouts & highlights only */\n  --dca-yellow:#FFB306;\n\n  /* Pure neutrals for text/UI scaffolding derived from the palette */\n  --dca-white:#FFFFFF;\n  --dca-ink:#183153;          /* body text sits in navy, never pure black */\n  --dca-ink-soft:#364B6D;\n  --dca-line:#E3E0D2;         /* hairline on warm neutrals */\n  --dca-line-blue:rgba(24,49,83,.12);\n\n  /* --- Gradients --------------------------------------------------------- */\n  --dca-gradient-light:linear-gradient(135deg,#C6DDEE 0%,#F8F7F2 100%); /* @kind color */\n  --dca-gradient-dark:linear-gradient(135deg,#364B6D 0%,#183153 100%); /* @kind color */\n  --dca-gradient-mark:linear-gradient(180deg,#70B7FF 0%,#2E7FE0 100%); /* @kind color */\n\n  /* --- Semantic aliases -------------------------------------------------- */\n  --surface-page:var(--dca-cream);\n  --surface-page-alt:var(--dca-off-white);\n  --surface-card:var(--dca-white);\n  --surface-sunken:var(--dca-beige);\n  --surface-invert:var(--dca-navy);\n\n  --text-heading:var(--dca-navy);\n  --text-body:var(--dca-navy);\n  --text-muted:var(--dca-ink-soft);\n  --text-on-invert:var(--dca-off-white);\n  --text-on-invert-muted:rgba(248,247,242,.72);\n\n  --border-subtle:var(--dca-line);\n  --border-strong:var(--dca-navy);\n\n  --accent:var(--dca-blue);\n  --accent-strong:var(--dca-navy);\n  --highlight:var(--dca-yellow);\n\n  --focus-ring:var(--dca-blue);\n\n  /* --- Proposition colours ---------------------------------------------- */\n  --prop-protect:var(--dca-navy);      /* DCA Protect */\n  --prop-core:var(--dca-blue);         /* DCA Core */\n  --prop-complete:var(--dca-beige);    /* DCA Complete */\n}\n<\u002Fstyle>\n<style>/* -------------------------------------------------------------------------- reAnywhereDesignSystem_8e92b5.Icon\" name=\"x\" size=\"16\" hint-size=\"16px,16px\"><\u002Fx-import>Cancel<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n          <div style=\"position:relative;margin-top:22px;background:#fff;border:1px solid #1463FF;border-radius:20px;padding:24px;display:flex;gap:16px;align-items:center;\">\n            <div style=\"position:absolute;top:-10px;left:22px;height:18px;padding:0 8px;border-radius:9px;background:#1463FF;color:#fff;font-size:10px;font-weight:600;display:flex;align-items:center;\">Next up<\u002Fdiv>\n            <div style=\"flex:1;\"><div style=\"font-size:17px;font-weight:600;color:#172B5A;\">Upload files<\u002Fdiv><div style=\"margin-top:8px;font-size:12px;line-height:1.55;color:#3A3F4B;\">{{ uploadText }}<\u002Fdiv><\u002Fdiv>\n            <button sc-camel-on-click=\"{{ pickFiles }}\" aria-label=\"Upload files\" style=\"width:44px;height:44px;flex:none;border-radius:50%;border:1px solid #1463FF;background:#fff;color:#1E5BEA;display:flex;align-items:center;justify-content:center;cursor:pointer;\"><x-import component-from-global-scope=\"DoctorCareAnywhereDesignSystem_8e92b5.Icon\" name=\"upload\" size=\"16\" hint-size=\"16px,16px\"><\u002Fx-import><\u002Fbutton>\n            <input ref=\"{{ fileRef }}\" type=\"file\" multiple=\"{{ true }}\" sc-camel-on-change=\"{{ onFiles }}\" style=\"display:none;\">\n          <\u002Fdiv>\n          <div style=\"margin-top:16px;background:#fff;border:1px solid #EEF1F6;border-radius:20px;padding:24px;box-shadow:0 6px 20px rgba(24,49,83,.05);\">\n            <div style=\"font-size:17px;font-weight:600;color:#172B5A;\">What happens next<\u002Fdiv>\n            <div style=\"margin-top:14px;font-size:13px;line-height:1.65;\">Your clinician’s aim is to get you the right care as quickly as possible. Depending on your symptoms, that could be advice, medication, tests, a referral or advice to seek urgent in-person care.<\u002Fdiv>\n            <div style=\"margin-top:6px;font-size:13px;line-height:1.65;font-weight:600;\">Tests, referrals, prescriptions or fit notes aren't guaranteed. Your clinician will decide what's appropriate and explain why.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"margin-top:16px;background:#fff;border:1px solid #EEF1F6;border-radius:14px;padding:14px 16px;display:flex;gap:12px;color:#A11B1B;\">\n            <x-import component-from-global-scope=\"DoctorCareAnywhereDesignSystem_8e92b5.Icon\" name=\"circle-alert\" size=\"16\" hint-size=\"16px,16px\"><\u002Fx-import>\n            <div><div style=\"font-size:13px;font-weight:600;\">Not for emergencies<\u002Fdiv><div style=\"margin-top:6px;font-size:12px;line-height:1.5;\">If you get worse before your appointment, please call 999 or visit your nearest A&amp;E department. Call NHS 111 if unsure.<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{ showCompact }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"position:absolute;top:0;left:0;right:0;z-index:40;padding:52px 24px 10px;background:rgba(238,245,254,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);\">\n        <div style=\"display:flex;align-items:center;gap:12px;height:40px;\">\n          <sc-if value=\"{{ showBack }}\" hint-placeholder-val=\"{{ false }}\"><button sc-camel-on-click=\"{{ goBack }}\" aria-label=\"Back\" style=\"width:40px;height:40px;flex:none;border-radius:50%;border:none;background:#fff;box-shadow:0 2px 8px rgba(24,49,83,.08);display:flex;align-items:center;justify-content:center;cursor:pointer;color:#1D1D1F;\"><x-import component-from-global-scope=\"DoctorCareAnywhereDesignSystem_8e92b5.Icon\" name=\"arrow-left\" size=\"18\" stroke-width=\"2\" hint-size=\"18px,18px\"><\u002Fx-import><\u002Fbutton><\u002Fsc-if>\n          <sc-if value=\"{{ hideBack }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"width:40px;flex:none;\"><\u002Fspan><\u002Fsc-if>\n          <div style=\"flex:1;text-align:center;font-size:17px;font-weight:600;color:#172B5A;\">Book an appointment<\u002Fdiv>\n          <button sc-camel-on-click=\"{{ openExit }}\" aria-label=\"Close\" style=\"width:40px;height:40px;flex:none;border-radius:50%;border:none;background:#fff;box-shadow:0 2px 8px rgba(24,49,83,.08);display:flex;align-items:center;justify-content:center;cursor:pointer;color:#1D1D1F;\"><x-import component-from-global-scope=\"DoctorCareAnywhereDesignSystem_8e92b5.Icon\" name=\"x\" size=\"18\" stroke-width=\"2\" hint-size=\"18px,18px\"><\u002Fx-import><\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"margin-top:8px;font-size:11px;font-weight:600;color:#3A3F4B;\">{{ stepLabel }}<\u002Fdiv>\n        <div style=\"margin-top:6px;height:5px;border-radius:3px;background:#DFE4EC;overflow:hidden;\"><div style=\"height:100%;width:{{ progressPct }};border-radius:3px;background:{{ progressBg }};\"><\u002Fdiv><\u002Fdiv>\n        <sc-if value=\"{{ compactSegments }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;background:#E4EDF9;border-radius:20px;padding:3px;margin-top:12px;\">\n            <sc-for list=\"{{ segments }}\" as=\"sg\" hint-placeholder-count=\"3\">\n              <button sc-camel-on-click=\"{{ sg.onPick }}\" style=\"flex:1;height:34px;border-radius:17px;border:none;background:{{ sg.bg }};box-shadow:{{ sg.shadow }};font-family:inherit;font-size:12px;font-weight:{{ sg.weight }};color:{{ sg.fg }};display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;\"><x-import component-from-global-scope=\"DoctorCareAnywhereDesignSystem_8e92b5.Icon\" name=\"{{ sg.icon }}\" size=\"15\" hint-size=\"15px,15px\"><\u002Fx-import>{{ sg.label }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ showCta }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"position:absolute;left:0;right:0;bottom:0;z-index:30;padding:28px 24px 36px;background:linear-gradient(to top,#EFF5FE 70%,rgba(239,245,254,0));display:flex;flex-direction:column;gap:16px;\">\n        <sc-if value=\"{{ payError }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"border-radius:16px;background:linear-gradient(rgba(255,255,255,0.7),rgba(255,255,255,0.7)),rgb(254,242,242);border:1px solid rgb(153,27,27);display:flex;gap:8px;padding:8px;color:rgb(153,27,27);\">\n            <x-import component-from-global-scope=\"DoctorCareAnywhereDesignSystem_8e92b5.Icon\" name=\"circle-alert\" size=\"20\" hint-size=\"20px,20px\"><\u002Fx-import>\n            <div style=\"display:flex;flex-direction:column;gap:4px;font-size:12px;line-height:18px;\"><span style=\"font-weight:600;min-height:20px;\">Payment error<\u002Fspan><span>Your payment could not be completed. Please try again.<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <button sc-camel-on-click=\"{{ ctaAction }}\" style=\"width:100%;height:44px;border-radius:22px;border:none;background:{{ ctaBg }};color:#fff;font-family:inherit;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;transition:background .2s;\">\n          <sc-if value=\"{{ ctaBusy }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.45);border-top-color:#fff;animation:dcaspin .8s linear infinite;box-sizing:border-box;\"><\u002Fspan><\u002Fsc-if>\n          {{ ctaLabel }}\n        <\u002Fbutton>\n        <sc-if value=\"{{ ctaNote }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"margin-top:14px;font-size:12px;line-height:1.55;color:#3A3F4B;\">If needed, you will be able to amend your clinician choice before booking.<\u002Fdiv><\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ showChoose }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"position:absolute;left:0;right:0;bottom:24px;z-index:30;display:flex;justify-content:center;pointer-events:none;\">\n        <button sc-camel-on-click=\"{{ openFilters }}\" style=\"pointer-events:auto;height:34px;padding:0 14px;border-radius:17px;border:1px solid #1463FF;background:#fff;color:#1E5BEA;font-family:inherit;font-size:11px;font-weight:600;display:flex;align-items:center;gap:8px;cursor:pointer;box-shadow:0 4px 14px rgba(24,49,83,.12);\">Choose clinician<x-import component-from-global-scope=\"DoctorCareAnywhereDesignSystem_8e92b5.Icon\" name=\"user-round\" size=\"15\" hint-size=\"15px,15px\"><\u002Fx-import><\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ hasSheet }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"position:absolute;inset:0;z-index:50;\">\n        <div sc-camel-on-click=\"{{ closeSheet }}\" style=\"position:absolute;inset:0;background:rgba(52,64,96,.32);\"><\u002Fdiv>\n        <div style=\"position:absolute;left:0;right:0;bottom:0;max-height:700px;display:flex;flex-direction:column;background:#fff;border-radius:28px 28px 0 0;box-shadow:0 -10px 30px rgba(24,49,83,.12);\">\n          <div style=\"display:flex;justify-content:center;padding:14px 0 0;\"><span style=\"width:54px;height:4px;border-radius:2px;background:#DDE1E8;\"><\u002Fspan><\u002Fdiv>\n          <div style=\"flex:1;min-height:0;overflow-y:auto;scrollbar-width:none;padding:18px 24px 12px;\">\n\n            <sc-if value=\"{{ sheetBefore }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"text-align:center;font-size:15px;font-weight:600;\">Before you book<\u002Fdiv>\n              <div style=\"margin-top:24px;display:flex;align-items:flex-start;gap:14px;\">\n                <span style=\"display:block;flex:none;align-self:flex-start;height:17px;line-height:0;margin-top:3px;\"><x-import component-from-global-scope=\"DoctorCareAnywhereDesignSystem_8e92b5.Icon\" name=\"hand\" size=\"17\" hint-size=\"17px,17px\"><\u002Fx-import><\u002Fspan>\n                <div style=\"flex:1;\">\n                  <div style=\"font-size:14px;line-height:1.6;\">We can't treat anything needing an in-person exam, like chest pain.<\u002Fdiv>\n                  <button sc-camel-on-click=\"{{ toggleCond }}\" style=\"margin-top:6px;border:none;background:none;padding:0;display:flex;align-items:center;gap:6px;color:#1E5BEA;font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;\">See conditions<x-import component-from-global-scope=\"DoctorCareAnywhereDesignSystem_8e92b5.Icon\" name=\"{{ condIcon }}\" size=\"14\" hint-size=\"14px,14px\"><\u002Fx-import><\u002Fbutton>\n                  <sc-if value=\"{{ showCond }}\" hint-placeholder-val=\"{{ false }}\">\n                    <ul style=\"margin:12px 0 0;padding-left:20px;font-size:14px;line-height:1.6;\"><li>Suspected chest infections<\u002Fli><li>Severe tummy pain<\u002Fli><li>Eye injuries or sudden changes to your sight<\u002Fli><li>Broken bones or deep cuts<\u002Fli><li>Problems in pregnancy<\u002Fli><li>Urine infections in children under 16, women over 65, pregnant women and men of any age<\u002Fli><li>Dental complaints<\u002Fli><\u002Ful>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"height:1px;background:#E6EAF0;margin:18px 0;\"><\u002Fdiv>\n              <div style=\"display:flex;align-items:flex-start;gap:14px;\">\n                <span style=\"display:block;flex:none;align-self:flex-start;height:17px;line-height:0;margin-top:3px;\"><x-import component-from-global-scope=\"DoctorCareAnywhereDesignSystem_8e92b5.Icon\" name=\"ban\" size=\"17\" hint-size=\"17px,17px\"><\u002Fx-import><\u002Fspan>\n                <div style=\"flex:1;\">\n                  <div style=\"font-size:14px;line-height:1.6;\">We can't prescribe controlled drugs, sleeping medication or repeat medication for long-term conditions.<\u002Fdiv>\n                  <button sc-camel-on-click=\"{{ toggleMeds }}\" style=\"margin-top:6px;border:none;background:none;padding:0;display:flex;align-items:center;gap:6px;color:#1E5BEA;font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;\">See medicines<x-import component-from-global-scope=\"DoctorCareAnywhereDesignSystem_8e92b5.Icon\" name=\"{{ medsIcon }}\" size=\"14\" hint-size=\"14px,14px\"><\u002Fx-import><\u002Fbutton>\n                  <sc-if value=\"{{ showMeds }}\" hint-placeholder-val=\"{{ false }}\">\n                    <ul style=\"margin:12px 0 0;padding-left:20px;font-size:14px;line-height:1.6;\"><li>Repeat prescriptions for long-term conditions, like high blood pressure or diabetes<\u002Fli><li>Controlled drugs, like strong painkillers or sleeping tablets<\u002Fli><li>ADHD medicine<\u002Fli><li>Medicines that need regular blood tests<\u002Fli><\u002Ful>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ sheetFaq }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"text-align:center;font-size:15px;font-weight:600;\">Who can you book for?<\u002Fdiv>\n              <div style=\"margin-top:22px;font-size:14px;line-height:1.6;display:flex;flex-direction:column;gap:14px;\">\n                <div><strong>Booking an appointment for a family member?<\u002Fstrong><br>We need to verify the identity of any family members before they can have an appointment. You can provide verification on behalf of a child by visiting the <a href=\"#\" style=\"font-weight:600;\">Manage my account<\u002Fa> page. Adult family members will need to verify their own identity before they can book an appointment.<\u002Fdiv>\n                <div>You can only book an appointment for yourself or an under-18 family member who you’ve fully registered for the service. Non-eligible family members will also appear in ‘Who are you booking for?’ dropdown menu during the booking process, but you won’t be able to select them. Please check and manage the status of all patients registered under your policy via the <a href=\"#\" style=\"font-weight:600;\">Manage my account<\u002Fa> page.<\u002Fdiv>\n                <div>For confidentiality reasons, clinical records and prescriptions need to be created and recorded against the correct name. Unfortunately, this means an appointment cannot go ahead if it is booked for somebody else under your name.<\u002Fdiv>\n                <div style=\"font-size:15px;font-weight:600;margin-top:6px;\">FAQs<\u002Fdiv>\n                <div><strong>How many people are covered by my policy?<\u002Fstrong><br>You can check how many people are covered by your policy by visiting your <a href=\"#\" style=\"font-weight:600;\">Manage my account<\u002Fa> page and checking the information at the top of the page.<\u002Fdiv>\n                <div><strong>How do I register an under-18 family member?<\u002Fstrong><br>If you are the main policy holder on a multi-person plan, you can add under-18 family members via your <a href=\"#\" style=\"font-weight:600;\">Manage my account<\u002Fa> page. Register their details, follow the guardianship verification steps, and you will be able to book appointments for them.<\u002Fdiv>\n                <div><strong>How do I register an over-18 family member?<\u002Fstrong><br>Over-18s need to create their own account. If you are the main policy holder on a multi-person plan, you can invite them to join by email. The invitee should click the link in the email to register. They can then book their own appointments through their own accounts once they have verified their identity.<\u002Fdiv>\n                <div><strong>Why can't I register my family members?<\u002Fstrong><br>The most common reasons why you can't register family members are:<ul style=\"margin:4px 0 0;padding-left:20px;\"><li>You are not the main policy holder. Only main policy holders can register family members.<\u002Fli><li>You only have a one-person plan or have reached the maximum number of patients eligible for the service under your policy.<\u002Fli><\u002Ful><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ sheetEmerg }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"display:flex;flex-direction:column;align-items:center;gap:14px;\">\n                <span style=\"width:40px;height:40px;border-radius:50%;background:#7A2E0E;color:#fff;display:flex;align-items:center;justify-content:center;\"><x-import component-from-global-scope=\"DoctorCareAnywhereDesignSystem_8e92b5.Icon\" name=\"triangle-alert\" size=\"20\" hint-size=\"20px,20px\"><\u002Fx-import><\u002Fspan>\n                <div style=\"font-size:15px;font-weight:600;\">Examples of emergencies<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"margin-top:28px;font-size:14px;font-weight:600;\">Call 999 or go to A&amp;E if you have:<\u002Fdiv>\n              <ul style=\"margin:8px 0 0;padding-left:20px;font-size:14px;line-height:1.6;\"><li>Chest pain or pressure<\u002Fli><li>Difficulty breathing<\u002Fli><li>Signs of a stroke, like a drooping face or slurred speech<\u002Fli><li>Heavy bleeding that will not stop<\u002Fli><li>A seizure, or you passed out<\u002Fli><li>Thoughts of harming yourself<\u002Fli><\u002Ful>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ sheetSlot }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"text-align:center;font-size:15px;font-weight:600;\">Available for your selected date and time<\u002Fdiv>\n              <div style=\"margin-top:8px;text-align:center;font-size:13px;color:#3A3F4B;\">{{ slotWhen }}<\u002Fdiv>\n              <div style=\"position:relative;margin-top:30px;border:1px solid #E3E8F0;border-radius:16px;padding:22px 16px 16px;\">\n                <div style=\"position:absolute;top:-10px;left:14px;display:flex;align-items:center;gap:4px;height:18px;padding:0 7px;border-radius:9px;font-size:10px;font-weight:600;background:#fff;color:#1E5BEA;border:1px solid #1463FF;\"><x-import component-from-global-scope=\"DoctorCareAnywhereDesignSystem_8e92b5.Icon\" name=\"clock\" size=\"11\" stroke-width=\"2.2\" hint-size=\"11px,11px\"><\u002Fx-import>{{ slotCard.badge }}<\u002Fdiv>\n                <div style=\"display:flex;justify-content:space-between;font-size:13px;font-weight:600;\"><span>{{ slotCard.name }}<\u002Fspan><sc-if value=\"{{ slotCard.showPrice }}\" hint-placeholder-val=\"{{ false }}\"><span>{{ slotCard.price }}<\u002Fspan><\u002Fsc-if><\u002Fdiv>\n                <div style=\"margin-top:10px;display:flex;gap:10px;font-size:12px;line-height:1.5;\"><span style=\"color:#1E7A43;display:flex;padding-top:2px;\"><x-import component-from-global-scope=\"DoctorCareAnywhereDesignSystem_8e92b5.Icon\" name=\"check\" size=\"14\" stroke-width=\"2\" hint-size=\"14px,14px\"><\u002Fx-import><\u002Fspan><span>{{ slotCard.summary }}<\u002Fspan><\u002Fdiv>\n                <sc-if value=\"{{ slotCard.hasCannot }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"margin-top:8px;display:flex;gap:10px;font-size:12px;line-height:1.5;\"><span style=\"color:#C0262D;display:flex;padding-top:2px;\"><x-import component-from-global-scope=\"DoctorCareAnywhereDesignSystem_8e92b5.Icon\" name=\"x\" size=\"14\" stroke-width=\"2\" hint-size=\"14px,14px\"><\u002Fx-import><\u002Fspan><span>{{ slotCard.cannot }}<\u002Fspan><\u002Fdiv><\u002Fsc-if>\n                <button sc-camel-on-click=\"{{ slotCard.onToggle }}\" style=\"margin-top:8px;border:none;background:none;padding:0;display:flex;align-items:center;gap:6px;color:#1E5BEA;font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;\">See what they do<x-import component-from-global-scope=\"DoctorCareAnywhereDesignSystem_8e92b5.Icon\" name=\"{{ slotCard.toggleIcon }}\" size=\"14\" hint-size=\"14px,14px\"><\u002Fx-import><\u002Fbutton>\n                <sc-if value=\"{{ slotCard.expanded }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"margin-top:10px;font-size:
